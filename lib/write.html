<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鲸鲸信箱 · 寄一封信</title>
<link rel="stylesheet" href="/whale-letter/letter.css">
</head>
<body data-page="write">

<div class="ambient"><span class="amb-glow g1"></span><span class="amb-glow g2"></span><span class="amb-glow g3"></span></div>

<div class="window">
  <div class="win-bar">
    <span class="win-brand">B SIDE · WHALE LETTER</span>
    <div class="win-dots"><i></i><i></i><i></i></div>
  </div>

  <div class="win-body single">
    <main class="reader">
      <div class="reader-head">
        <div class="reader-meta">
          <span class="date" id="writeDate">—</span>
          <h2>给鲸鲸的一封信</h2>
        </div>
        <div class="reader-actions">
          <a class="btn-ghost-round" href="/whale-letter/read">去收信</a>
          <span class="counter" id="counter">0 / 2000</span>
        </div>
      </div>

      <div class="paper compose-paper">
        <div class="stamp"></div><div class="postmark"></div>
        <div class="paper-inner">
          <div class="paper-date" id="composeDate"></div>
          <div class="compose-label">鲸鲸：</div>
          <textarea class="note" id="note" maxlength="2000" placeholder="想说什么都可以，慢慢写……"></textarea>
        </div>
      </div>

      <div class="compose-actions">
        <button class="btn-ghost" id="clearBtn">把纸铺平</button>
        <button class="btn-light" id="sendBtn">封好，寄出去</button>
      </div>
      <div class="notice hidden" id="notice"></div>
      <span id="statDelivered" class="hidden"></span>
    </main>
  </div>

  <div class="win-foot"><span>LUNE · WHALE LETTER</span><span>慢慢来</span></div>
</div>

<script src="/whale-letter/letter.js"></script>
</body>
</html>
